<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bloons Defense Ultimate</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    background: #14181d;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #wrapper {
    position: relative;
    width: 960px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(0,0,0,0.7);
    background: #2f3640;
  }
  #menu-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #192a56 0%, #273c75 50%, #1e272e 100%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
  }
  #menu-screen h1 {
    font-size: 46px;
    margin: 0 0 8px 0;
    color: #fbc531;
    text-shadow: 0 4px 0 #c23616;
    letter-spacing: 1px;
  }
  #menu-screen p { color: #dcdde1; margin-bottom: 24px; font-size: 16px; }
  .menu-section { margin-bottom: 22px; width: 100%; max-width: 720px; }
  .menu-section h3 { margin: 0 0 10px 0; color: #00a8ff; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
  .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .choice-btn {
    padding: 12px 20px;
    font-size: 15px;
    font-weight: bold;
    border: 2px solid #718093;
    border-radius: 8px;
    background: #2f3640;
    color: #f5f6fa;
    cursor: pointer;
    transition: 0.15s;
  }
  .choice-btn:hover { border-color: #fbc531; transform: translateY(-2px); }
  .choice-btn.active { background: #fbc531; color: #1e272e; border-color: #fff; }
  #start-game-btn {
    margin-top: 10px;
    padding: 16px 48px;
    font-size: 22px;
    font-weight: bold;
    background: #44bd32;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 5px 0 #218c74;
    transition: 0.1s;
  }
  #start-game-btn:hover { background: #4cd137; transform: translateY(-2px); }
  #start-game-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #218c74; }

  #ui-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: #1e272e;
    border-bottom: 2px solid #353b48;
    font-weight: bold;
    font-size: 16px;
  }
  .hud-stats { display: flex; gap: 22px; }
  .hud-controls { display: flex; gap: 8px; }
  button.ctrl-btn {
    padding: 7px 14px;
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #00a8ff;
    color: #fff;
  }
  button.ctrl-btn:disabled { background: #57606f; cursor: not-allowed; }
  #wave-btn { background: #44bd32; }
  #menu-btn { background: #e84118; }

  canvas { display: block; cursor: crosshair; }

  #ui-bottom {
    background: #1e272e;
    padding: 10px 14px;
    border-top: 2px solid #353b48;
  }
  #tower-shop {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .tower-card {
    background: #2f3640;
    border: 2px solid #40739e;
    border-radius: 6px;
    padding: 6px 4px;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: 0.1s;
  }
  .tower-card:hover:not(:disabled) { border-color: #fbc531; background: #353b48; }
  .tower-card.selected { background: #fbc531; color: #1e272e; border-color: #fff; }
  .tower-card:disabled { opacity: 0.45; cursor: not-allowed; }
  .tower-card span { display: block; color: #4cd137; font-size: 12px; margin-top: 2px; }
  .tower-card.selected span { color: #1e272e; }

  #upgrade-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2f3640;
    padding: 8px 14px;
    border-radius: 6px;
    min-height: 44px;
    font-size: 14px;
  }
  #upg-actions { display: flex; gap: 8px; }
</style>
</head>
<body>

<div id="wrapper">
  <div id="menu-screen">
    <h1>BLOONS DEFENSE ULTIMATE</h1>
    <p>13 Custom Towers • Multi-Layer Armor • Cash-Generating Banks</p>

    <div class="menu-section">
      <h3>1. Select Map</h3>
      <div class="btn-group" id="map-choices">
        <button class="choice-btn active" onclick="chooseMap(0, this)">Monkey Meadow</button>
        <button class="choice-btn" onclick="chooseMap(1, this)">Scorched Canyon</button>
        <button class="choice-btn" onclick="chooseMap(2, this)">Frozen Loop</button>
      </div>
    </div>

    <div class="menu-section">
      <h3>2. Select Difficulty</h3>
      <div class="btn-group" id="diff-choices">
        <button class="choice-btn" onclick="chooseDiff('easy', this)">Easy ($350 | 150 Lives)</button>
        <button class="choice-btn active" onclick="chooseDiff('medium', this)">Medium ($250 | 100 Lives)</button>
        <button class="choice-btn" onclick="chooseDiff('hard', this)">Hard ($200 | 60 Lives)</button>
        <button class="choice-btn" onclick="chooseDiff('impoppable', this)">Impoppable ($175 | 1 Life)</button>
      </div>
    </div>

    <button id="start-game-btn" onclick="launchGame()">START GAME</button>
  </div>

  <div id="ui-top">
    <div class="hud-stats">
      <div>Lives: <span id="lives">100</span></div>
      <div>Cash: $<span id="cash">250</span></div>
      <div>Wave: <span id="wave">0</span></div>
      <div id="diff-badge" style="color:#fbc531;">MEDIUM</div>
    </div>
    <div class="hud-controls">
      <button class="ctrl-btn" id="wave-btn" onclick="startWave()">Start Wave</button>
      <button class="ctrl-btn" id="speed-btn" onclick="toggleSpeed()">Speed: 1x</button>
      <button class="ctrl-btn" id="menu-btn" onclick="returnToMenu()">Menu</button>
    </div>
  </div>

  <canvas id="game" width="960" height="460"></canvas>

  <div id="ui-bottom">
    <div id="tower-shop"></div>
    <div id="upgrade-bar">
      <div id="tower-info">Select a tower above to deploy, or click a placed tower to inspect & upgrade.</div>
      <div id="upg-actions" style="display:none;">
        <button class="ctrl-btn" id="btn-upg" onclick="upgradeTower()">Upgrade</button>
        <button class="ctrl-btn" id="btn-collect" style="background:#fbc531; color:#1e272e; display:none;" onclick="collectBank()">Collect</button>
        <button class="ctrl-btn" id="btn-sell" style="background:#e84118;" onclick="sellTower()">Sell</button>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const MAPS = [
  {
    name: 'Monkey Meadow',
    bg: '#4cd137',
    pathColor: '#dcdde1',
    borderColor: '#7f8fa6',
    waypoints: [
      {x: 0, y: 90}, {x: 220, y: 90}, {x: 220, y: 360},
      {x: 480, y: 360}, {x: 480, y: 120}, {x: 750, y: 120},
      {x: 750, y: 380}, {x: 960, y: 380}
    ]
  },
  {
    name: 'Scorched Canyon',
    bg: '#e1b12c',
    pathColor: '#8c7ae6',
    borderColor: '#4834d4',
    waypoints: [
      {x: 0, y: 230}, {x: 160, y: 70}, {x: 360, y: 390},
      {x: 560, y: 70}, {x: 760, y: 390}, {x: 960, y: 230}
    ]
  },
  {
    name: 'Frozen Loop',
    bg: '#7ed6df',
    pathColor: '#f5f6fa',
    borderColor: '#22a6b3',
    waypoints: [
      {x: 120, y: 0}, {x: 120, y: 370}, {x: 820, y: 370},
      {x: 820, y: 80}, {x: 320, y: 80}, {x: 320, y: 250},
      {x: 960, y: 250}
    ]
  }
];

const DIFFICULTIES = {
  easy:       { label: 'EASY',       lives: 150, cash: 350, costMult: 0.85, hpScale: 0.8 },
  medium:     { label: 'MEDIUM',     lives: 100, cash: 250, costMult: 1.0,  hpScale: 1.0 },
  hard:       { label: 'HARD',       lives: 60,  cash: 200, costMult: 1.15, hpScale: 1.25 },
  impoppable: { label: 'IMPOPPABLE', lives: 1,   cash: 175, costMult: 1.3,  hpScale: 1.5 }
};

const TOWER_DEFS = {
  dart:    { name: 'Dart Monkey',    cost: 60,  range: 115, rate: 38, dmg: 1, mech: 'single',  lead: false, desc: 'Fast basic dart thrower.' },
  tack:    { name: 'Tack Shooter',   cost: 110, range: 80,  rate: 55, dmg: 1, mech: 'radial',  lead: false, desc: 'Fires 8 tacks in a full circle.' },
  sniper:  { name: 'Sniper Monkey',  cost: 180, range: 999, rate: 85, dmg: 3, mech: 'hitscan', lead: true,  desc: 'Infinite range & pops Lead armor.' },
  bomb:    { name: 'Bomb Shooter',   cost: 220, range: 120, rate: 70, dmg: 2, mech: 'splash',  lead: true,  desc: 'Explosive area damage; breaks Lead.' },
  ice:     { name: 'Ice Tower',      cost: 160, range: 95,  rate: 65, dmg: 0, mech: 'freeze',  lead: false, desc: 'Chills nearby bloons, slowing them by 50%.' },
  glue:    { name: 'Glue Gunner',    cost: 140, range: 115, rate: 45, dmg: 0, mech: 'glue',    lead: false, desc: 'Coats bloons in sticky glue that deals DoT.' },
  wizard:  { name: 'Wizard Monkey',  cost: 240, range: 135, rate: 48, dmg: 2, mech: 'homing',  lead: true,  desc: 'Fires homing arcane bolts.' },
  ninja:   { name: 'Ninja Monkey',   cost: 210, range: 125, rate: 32, dmg: 1, mech: 'spread',  lead: false, desc: 'Throws 3 shurikens in a fan spread.' },
  laser:   { name: 'Laser Cannon',   cost: 340, range: 140, rate: 25, dmg: 1, mech: 'pierce',  lead: true,  desc: 'Fires piercing energy beams through lines.' },
  tesla:   { name: 'Tesla Coil',     cost: 300, range: 110, rate: 58, dmg: 2, mech: 'chain',   lead: true,  desc: 'Zaps up to 4 nearby bloons with chain lightning.' },
  mortar:  { name: 'Mortar Cannon',  cost: 280, range: 999, rate: 95, dmg: 4, mech: 'mortar',  lead: true,  desc: 'Drops heavy shells on the strongest bloon.' },
  super:   { name: 'Super Monkey',   cost: 650, range: 165, rate: 9,  dmg: 1, mech: 'single',  lead: false, desc: 'Hypersonic dart stream that shreds waves.' },
  bank:    { name: 'Monkey Bank',    cost: 300, range: 50,  rate: 120,dmg: 0, mech: 'bank',    lead: false, desc: 'Generates $35 per tick during waves (holds up to $600).' }
};

const BLOON_TIERS = [
  null,
  { name: 'Red',     color: '#e84118', speed: 1.3, r: 11, lead: false, boss: false },
  { name: 'Blue',    color: '#00a8ff', speed: 1.7, r: 12, lead: false, boss: false },
  { name: 'Green',   color: '#4cd137', speed: 2.1, r: 13, lead: false, boss: false },
  { name: 'Yellow',  color: '#fbc531', speed: 2.7, r: 14, lead: false, boss: false },
  { name: 'Pink',    color: '#ff9ff3', speed: 3.3, r: 14, lead: false, boss: false },
  { name: 'Lead',    color: '#7f8fa6', speed: 1.1, r: 15, lead: true,  boss: false },
  { name: 'Ceramic', color: '#cd6133', speed: 2.0, r: 16, lead: false, boss: false },
  { name: 'MOAB',    color: '#2980b9', speed: 0.7, r: 26, lead: true,  boss: true }
];

let chosenMapIdx = 0;
let chosenDiffKey = 'medium';
let lives = 100, cash = 250, wave = 0, speedMult = 1;
let waveActive = false, gameOver = false, inMenu = true;
let selectedTowerType = null, selectedPlaced = null;
let mousePos = { x: 0, y: 0 };

let towers = [], bloons = [], projectiles = [], effects = [], spawnQueue = [];
let spawnTimer = 0;

function chooseMap(idx, btn) {
  chosenMapIdx = idx;
  document.querySelectorAll('#map-choices .choice-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function chooseDiff(key, btn) {
  chosenDiffKey = key;
  document.querySelectorAll('#diff-choices .choice-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function launchGame() {
  const diff = DIFFICULTIES[chosenDiffKey];
  lives = diff.lives;
  cash = diff.cash;
  wave = 0;
  speedMult = 1;
  waveActive = false;
  gameOver = false;
  inMenu = false;
  towers = [];
  bloons = [];
  projectiles = [];
  effects = [];
  spawnQueue = [];
  selectedTowerType = null;
  selectedPlaced = null;

  document.getElementById('diff-badge').innerText = diff.label;
  document.getElementById('speed-btn').innerText = 'Speed: 1x';
  document.getElementById('menu-screen').style.display = 'none';
  buildShop();
  updateUI();
}

function returnToMenu() {
  inMenu = true;
  document.getElementById('menu-screen').style.display = 'flex';
}

function getTowerCost(key) {
  return Math.round(TOWER_DEFS[key].cost * DIFFICULTIES[chosenDiffKey].costMult);
}

function buildShop() {
  const shop = document.getElementById('tower-shop');
  shop.innerHTML = '';
  Object.keys(TOWER_DEFS).forEach(key => {
    const def = TOWER_DEFS[key];
    const cost = getTowerCost(key);
    const btn = document.createElement('button');
    btn.className = 'tower-card';
    btn.id = 'shop-' + key;
    btn.innerHTML = `${def.name}<span>$${cost}</span>`;
    btn.onclick = () => selectTowerType(key);
    shop.appendChild(btn);
  });
}

function selectTowerType(key) {
  if (gameOver) return;
  selectedPlaced = null;
  selectedTowerType = (selectedTowerType === key) ? null : key;
  updateUI();
}

function toggleSpeed() {
  speedMult = speedMult === 1 ? 2 : 1;
  document.getElementById('speed-btn').innerText = `Speed: ${speedMult}x`;
}

function upgradeTower() {
  if (!selectedPlaced || selectedPlaced.level >= 4) return;
  const cost = Math.round(selectedPlaced.baseCost * 0.85 * selectedPlaced.level);
  if (cash < cost) return;
  cash -= cost;
  selectedPlaced.spent += cost;
  selectedPlaced.level++;
  if (selectedPlaced.mech === 'bank') {
    selectedPlaced.bankIncome += 25;
    selectedPlaced.bankCap += 300;
  } else {
    selectedPlaced.dmg += 1;
    selectedPlaced.rate = Math.max(6, Math.floor(selectedPlaced.rate * 0.82));
    if (selectedPlaced.range < 900) selectedPlaced.range += 15;
    if (selectedPlaced.level >= 3) selectedPlaced.lead = true;
  }
  updateUI();
}

function collectBank() {
  if (!selectedPlaced || selectedPlaced.mech !== 'bank' || selectedPlaced.bankBalance <= 0) return;
  cash += selectedPlaced.bankBalance;
  selectedPlaced.bankBalance = 0;
  updateUI();
}

function sellTower() {
  if (!selectedPlaced) return;
  if (selectedPlaced.mech === 'bank') cash += selectedPlaced.bankBalance;
  cash += Math.floor(selectedPlaced.spent * 0.7);
  towers = towers.filter(t => t !== selectedPlaced);
  selectedPlaced = null;
  updateUI();
}

function updateUI() {
  document.getElementById('lives').innerText = lives;
  document.getElementById('cash').innerText = cash;
  document.getElementById('wave').innerText = wave;
  document.getElementById('wave-btn').disabled = waveActive || gameOver;

  Object.keys(TOWER_DEFS).forEach(key => {
    const btn = document.getElementById('shop-' + key);
    if (!btn) return;
    btn.classList.toggle('selected', selectedTowerType === key);
    btn.disabled = cash < getTowerCost(key);
  });

  const info = document.getElementById('tower-info');
  const actions = document.getElementById('upg-actions');
  const btnUpg = document.getElementById('btn-upg');
  const btnCol = document.getElementById('btn-collect');
  const btnSell = document.getElementById('btn-sell');

  if (selectedPlaced) {
    actions.style.display = 'flex';
    const upgCost = Math.round(selectedPlaced.baseCost * 0.85 * selectedPlaced.level);
    btnUpg.disabled = selectedPlaced.level >= 4 || cash < upgCost;
    btnUpg.innerText = selectedPlaced.level >= 4 ? 'MAX LEVEL' : `Upgrade ($${upgCost})`;
    btnSell.innerText = `Sell ($${Math.floor(selectedPlaced.spent * 0.7)})`;

    if (selectedPlaced.mech === 'bank') {
      btnCol.style.display = 'inline-block';
      btnCol.disabled = selectedPlaced.bankBalance <= 0;
      btnCol.innerText = `Collect ($${selectedPlaced.bankBalance})`;
      info.innerHTML = `<b>${selectedPlaced.name} (Lvl ${selectedPlaced.level})</b> — Stored: $${selectedPlaced.bankBalance}/$${selectedPlaced.bankCap} (+$${selectedPlaced.bankIncome}/tick)`;
    } else {
      btnCol.style.display = 'none';
      info.innerHTML = `<b>${selectedPlaced.name} (Lvl ${selectedPlaced.level})</b> — Dmg: ${selectedPlaced.dmg} | Lead Pierce: ${selectedPlaced.lead ? 'Yes' : 'No'} | ${selectedPlaced.desc}`;
    }
  } else {
    actions.style.display = 'none';
    if (selectedTowerType) {
      const def = TOWER_DEFS[selectedTowerType];
      info.innerHTML = `<b>${def.name}:</b> ${def.desc} <i>(Click valid terrain to place)</i>`;
    } else {
      info.innerText = 'Select a tower above to deploy, or click a placed tower to inspect & upgrade.';
    }
  }
}

function distToSegment(p, v, w) {
  const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
  if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
  let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
}

function isValidPlacement(x, y) {
  if (x < 24 || x > canvas.width - 24 || y < 24 || y > canvas.height - 24) return false;
  for (let t of towers) {
    if (Math.hypot(t.x - x, t.y - y) < 36) return false;
  }
  const wp = MAPS[chosenMapIdx].waypoints;
  for (let i = 0; i < wp.length - 1; i++) {
    if (distToSegment({x, y}, wp[i], wp[i + 1]) < 34) return false;
  }
  return true;
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mousePos.x = e.clientX - rect.left;
  mousePos.y = e.clientY - rect.top;
});

canvas.addEventListener('click', () => {
  if (inMenu || gameOver) return;
  if (selectedTowerType) {
    const cost = getTowerCost(selectedTowerType);
    if (cash >= cost && isValidPlacement(mousePos.x, mousePos.y)) {
      cash -= cost;
      const def = TOWER_DEFS[selectedTowerType];
      towers.push({
        x: mousePos.x,
        y: mousePos.y,
        key: selectedTowerType,
        ...def,
        baseCost: cost,
        spent: cost,
        level: 1,
        angle: 0,
        cooldown: 0,
        bankBalance: 0,
        bankIncome: 35,
        bankCap: 600
      });
      selectedTowerType = null;
      updateUI();
    }
  } else {
    selectedPlaced = towers.find(t => Math.hypot(t.x - mousePos.x, t.y - mousePos.y) < 22) || null;
    updateUI();
  }
});

function startWave() {
  if (waveActive || gameOver) return;
  wave++;
  waveActive = true;
  spawnQueue = [];
  const scale = DIFFICULTIES[chosenDiffKey].hpScale;
  const count = Math.round((8 + wave * 4) * scale);

  for (let i = 0; i < count; i++) {
    let tier = 1;
    if (wave >= 2 && i % 3 === 0) tier = 2;
    if (wave >= 3 && i % 4 === 0) tier = 3;
    if (wave >= 4 && i % 5 === 0) tier = 4;
    if (wave >= 5 && i % 6 === 0) tier = 5;
    if (wave >= 6 && i % 7 === 0) tier = 6;
    if (wave >= 8 && i % 9 === 0) tier = 7;
    spawnQueue.push(tier);
  }
  if (wave % 10 === 0) {
    for (let m = 0; m < wave / 10; m++) spawnQueue.push(8);
  }
  updateUI();
}

function spawnBloon(tier) {
  const start = MAPS[chosenMapIdx].waypoints[0];
  const isMoab = tier === 8;
  bloons.push({
    x: start.x,
    y: start.y,
    wp: 1,
    tier: tier,
    hp: isMoab ? Math.round(45 * DIFFICULTIES[chosenDiffKey].hpScale) : 1,
    dist: 0,
    slowTimer: 0,
    glueTimer: 0
  });
}

function update() {
  if (inMenu || gameOver) return;

  if (waveActive) {
    if (spawnQueue.length > 0) {
      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnBloon(spawnQueue.shift());
        spawnTimer = Math.max(10, 32 - wave * 1.2);
      }
    } else if (bloons.length === 0) {
      waveActive = false;
      cash += 60 + wave * 12;
      updateUI();
    }
  }

  const wp = MAPS[chosenMapIdx].waypoints;
  for (let i = bloons.length - 1; i >= 0; i--) {
    const b = bloons[i];
    const spec = BLOON_TIERS[b.tier];

    let spdMult = 1;
    if (b.slowTimer > 0) { b.slowTimer--; spdMult *= 0.5; }
    if (b.glueTimer > 0) {
      b.glueTimer--;
      spdMult *= 0.7;
      if (b.glueTimer % 45 === 0) damageBloon(b, 1, true);
    }
    if (!bloons.includes(b)) continue;

    const target = wp[b.wp];
    const dx = target.x - b.x, dy = target.y - b.y;
    const d = Math.hypot(dx, dy);
    const moveSpd = spec.speed * spdMult;

    if (d < moveSpd) {
      b.x = target.x; b.y = target.y; b.wp++;
      if (b.wp >= wp.length) {
        lives -= b.tier === 8 ? 25 : b.tier;
        bloons.splice(i, 1);
        if (lives <= 0) {
          lives = 0;
          gameOver = true;
        }
        updateUI();
      }
    } else {
      b.x += (dx / d) * moveSpd;
      b.y += (dy / d) * moveSpd;
      b.dist += moveSpd;
    }
  }

  for (let t of towers) {
    if (t.cooldown > 0) {
      t.cooldown--;
      continue;
    }

    if (t.mech === 'bank') {
      if (waveActive && t.bankBalance < t.bankCap) {
        t.bankBalance = Math.min(t.bankCap, t.bankBalance + t.bankIncome);
        effects.push({ type: 'text', x: t.x, y: t.y - 22, text: `+$${t.bankIncome}`, color: '#fbc531', life: 30 });
        if (selectedPlaced === t) updateUI();
      }
      t.cooldown = t.rate;
      continue;
    }

    let target = null;
    if (t.mech === 'mortar') {
      let maxTier = -1;
      for (let b of bloons) {
        if (b.tier > maxTier) { maxTier = b.tier; target = b; }
      }
    } else {
      let maxDist = -1;
      for (let b of bloons) {
        if (Math.hypot(b.x - t.x, b.y - t.y) <= t.range && b.dist > maxDist) {
          maxDist = b.dist;
          target = b;
        }
      }
    }

    if (!target) continue;
    t.angle = Math.atan2(target.y - t.y, target.x - t.x);
    t.cooldown = t.rate;

    if (t.mech === 'radial') {
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
        projectiles.push({ x: t.x, y: t.y, vx: Math.cos(a)*7, vy: Math.sin(a)*7, dmg: t.dmg, lead: t.lead, life: 13, kind: 'tack' });
      }
    } else if (t.mech === 'hitscan') {
      damageBloon(target, t.dmg, t.lead);
      effects.push({ type: 'beam', x1: t.x, y1: t.y, x2: target.x, y2: target.y, color: '#fbc531', life: 6 });
    } else if (t.mech === 'freeze') {
      effects.push({ type: 'ring', x: t.x, y: t.y, r: t.range, color: 'rgba(116, 185, 255, 0.5)', life: 12 });
      for (let b of bloons) {
        if (Math.hypot(b.x - t.x, b.y - t.y) <= t.range) {
          b.slowTimer = 110;
          if (t.dmg > 0) damageBloon(b, t.dmg, t.lead);
        }
      }
    } else if (t.mech === 'chain') {
      let hitList = [target];
      let curr = target;
      for (let c = 0; c < 3; c++) {
        let next = bloons.find(b => !hitList.includes(b) && Math.hypot(b.x - curr.x, b.y - curr.y) < 85);
        if (next) { hitList.push(next); curr = next; } else break;
      }
      let prevX = t.x, prevY = t.y;
      hitList.forEach(b => {
        effects.push({ type: 'beam', x1: prevX, y1: prevY, x2: b.x, y2: b.y, color: '#00a8ff', life: 8 });
        prevX = b.x; prevY = b.y;
        damageBloon(b, t.dmg, t.lead);
      });
    } else if (t.mech === 'mortar') {
      effects.push({ type: 'boom', x: target.x, y: target.y, r: 65, life: 14 });
      for (let i = bloons.length - 1; i >= 0; i--) {
        if (Math.hypot(bloons[i].x - target.x, bloons[i].y - target.y) <= 65) {
          damageBloon(bloons[i], t.dmg, t.lead);
        }
      }
    } else if (t.mech === 'spread') {
      [-0.22, 0, 0.22].forEach(offset => {
        const ang = t.angle + offset;
        projectiles.push({ x: t.x, y: t.y, vx: Math.cos(ang)*9, vy: Math.sin(ang)*9, dmg: t.dmg, lead: t.lead, life: 22, kind: 'shuriken' });
      });
    } else if (t.mech === 'pierce') {
      projectiles.push({ x: t.x, y: t.y, vx: Math.cos(t.angle)*12, vy: Math.sin(t.angle)*12, dmg: t.dmg, lead: t.lead, life: 20, pierce: 4, hitSet: new Set(), kind: 'laser' });
    } else {
      projectiles.push({
        x: t.x, y: t.y,
        vx: Math.cos(t.angle) * 8.5,
        vy: Math.sin(t.angle) * 8.5,
        dmg: t.dmg,
        lead: t.lead,
        life: 55,
        kind: t.mech,
        target: t.mech === 'homing' ? target : null
      });
    }
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life--;
    if (p.life <= 0) { projectiles.splice(i, 1); continue; }

    if (p.kind === 'homing' && p.target && bloons.includes(p.target)) {
      const ang = Math.atan2(p.target.y - p.y, p.target.x - p.x);
      p.vx = Math.cos(ang) * 8.5;
      p.vy = Math.sin(ang) * 8.5;
    }

    p.x += p.vx;
    p.y += p.vy;

    for (let j = bloons.length - 1; j >= 0; j--) {
      const b = bloons[j];
      if (p.hitSet && p.hitSet.has(b)) continue;
      if (Math.hypot(p.x - b.x, p.y - b.y) < BLOON_TIERS[b.tier].r + 5) {
        if (p.kind === 'splash') {
          effects.push({ type: 'boom', x: p.x, y: p.y, r: 55, life: 12 });
          for (let k = bloons.length - 1; k >= 0; k--) {
            if (Math.hypot(p.x - bloons[k].x, p.y - bloons[k].y) <= 55) {
              damageBloon(bloons[k], p.dmg, p.lead);
            }
          }
          projectiles.splice(i, 1);
        } else if (p.kind === 'glue') {
          b.glueTimer = 180;
          if (p.dmg > 0) damageBloon(b, p.dmg, p.lead);
          projectiles.splice(i, 1);
        } else if (p.kind === 'pierce') {
          p.hitSet.add(b);
          damageBloon(b, p.dmg, p.lead);
          p.pierce--;
          if (p.pierce <= 0) projectiles.splice(i, 1);
        } else {
          damageBloon(b, p.dmg, p.lead);
          projectiles.splice(i, 1);
        }
        break;
      }
    }
  }

  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].life--;
    if (effects[i].type === 'text') effects[i].y -= 0.6;
    if (effects[i].life <= 0) effects.splice(i, 1);
  }
}

function damageBloon(b, dmg, canPierceLead) {
  const idx = bloons.indexOf(b);
  if (idx === -1) return;
  const spec = BLOON_TIERS[b.tier];
  if (spec.lead && !canPierceLead) {
    effects.push({ type: 'text', x: b.x, y: b.y - 10, text: 'ARMOR', color: '#fff', life: 15 });
    return;
  }

  if (b.tier === 8) {
    b.hp -= dmg;
    cash += 2;
    if (b.hp <= 0) {
      for (let c = 0; c < 3; c++) {
        bloons.push({ x: b.x + (c - 1) * 14, y: b.y, wp: b.wp, tier: 7, hp: 1, dist: b.dist, slowTimer: 0, glueTimer: 0 });
      }
      bloons.splice(idx, 1);
    }
  } else {
    const popped = Math.min(b.tier, dmg);
    cash += popped * 2;
    b.tier -= dmg;
    if (b.tier <= 0) bloons.splice(idx, 1);
  }
  updateUI();
}

function drawTowerModel(t) {
  ctx.save();
  ctx.translate(t.x, t.y);

  if (t.level > 1) {
    ctx.strokeStyle = '#fbc531';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 19, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (t.key === 'bank') {
    ctx.fillStyle = '#f5f6fa';
    ctx.fillRect(-16, -12, 32, 24);
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.moveTo(-19, -12);
    ctx.lineTo(0, -24);
    ctx.lineTo(19, -12);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fbc531';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('$', 0, 6);
    const pct = t.bankBalance / t.bankCap;
    ctx.fillStyle = '#1e272e';
    ctx.fillRect(-15, 14, 30, 5);
    ctx.fillStyle = '#4cd137';
    ctx.fillRect(-15, 14, 30 * pct, 5);
    ctx.restore();
    return;
  }

  if (t.key !== 'tack' && t.key !== 'ice' && t.key !== 'tesla') {
    ctx.rotate(t.angle);
  }

  switch (t.key) {
    case 'dart':
      ctx.fillStyle = '#8c5230';
      ctx.beginPath(); ctx.arc(0, -13, 5, 0, Math.PI*2); ctx.arc(0, 13, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f3c69f';
      ctx.beginPath(); ctx.arc(4, 0, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e84118';
      ctx.fillRect(10, -2, 12, 4);
      break;

    case 'tack':
      ctx.fillStyle = '#e84393';
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 3;
      for (let a = 0; a < Math.PI*2; a += Math.PI/4) {
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*10, Math.sin(a)*10); ctx.lineTo(Math.cos(a)*19, Math.sin(a)*19); ctx.stroke();
      }
      break;

    case 'sniper':
      ctx.fillStyle = '#2d3436';
      ctx.fillRect(6, -3, 22, 6);
      ctx.fillStyle = '#009432';
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fbc531'; ctx.lineWidth = 2;
      ctx.strokeRect(12, -4, 6, 8);
      break;

    case 'bomb':
      ctx.fillStyle = '#636e72';
      ctx.fillRect(-10, -15, 16, 4); ctx.fillRect(-10, 11, 16, 4);
      ctx.fillStyle = '#1e272e';
      ctx.beginPath(); ctx.arc(-2, 0, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(0, -8, 19, 16);
      break;

    case 'ice':
      ctx.fillStyle = '#74b9ff';
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i;
        ctx.lineTo(Math.cos(a)*17, Math.sin(a)*17);
        ctx.lineTo(Math.cos(a + 0.5)*8, Math.sin(a + 0.5)*8);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
      break;

    case 'glue':
      ctx.fillStyle = '#fbc531';
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#4cd137';
      ctx.beginPath(); ctx.arc(-4, 0, 7, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(10, -4, 11, 8);
      break;

    case 'wizard':
      ctx.fillStyle = '#8c7ae6';
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fbc531';
      ctx.beginPath(); ctx.arc(15, 6, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#4834d4';
      ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(10, 0); ctx.lineTo(-8, 8); ctx.closePath(); ctx.fill();
      break;

    case 'ninja':
      ctx.fillStyle = '#c23616';
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f5f6fa';
      ctx.fillRect(4, -7, 6, 14);
      ctx.fillStyle = '#1e272e';
      ctx.beginPath(); ctx.arc(7, -3, 1.5, 0, Math.PI*2); ctx.arc(7, 3, 1.5, 0, Math.PI*2); ctx.fill();
      break;

    case 'laser':
      ctx.fillStyle = '#7f8fa6';
      ctx.fillRect(-10, -11, 24, 22);
      ctx.fillStyle = '#e84118';
      ctx.fillRect(4, -3, 18, 6);
      break;

    case 'tesla':
      ctx.fillStyle = '#353b48';
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#e17055'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#00a8ff';
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
      break;

    case 'mortar':
      ctx.fillStyle = '#556b2f';
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#2f3640';
      ctx.fillRect(-4, -9, 18, 18);
      break;

    case 'super':
      ctx.fillStyle = '#e84118';
      ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(-20, 0); ctx.lineTo(-6, 12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0097e6';
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fbc531';
      ctx.beginPath(); ctx.arc(5, 0, 6, 0, Math.PI*2); ctx.fill();
      break;
  }

  ctx.restore();
}

function draw() {
  if (inMenu) return;
  const map = MAPS[chosenMapIdx];

  ctx.fillStyle = map.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = map.borderColor;
  ctx.lineWidth = 48;
  ctx.beginPath();
  ctx.moveTo(map.waypoints[0].x, map.waypoints[0].y);
  map.waypoints.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.stroke();

  ctx.strokeStyle = map.pathColor;
  ctx.lineWidth = 38;
  ctx.stroke();

  if (selectedTowerType) {
    const def = TOWER_DEFS[selectedTowerType];
    const valid = isValidPlacement(mousePos.x, mousePos.y);
    ctx.beginPath();
    ctx.arc(mousePos.x, mousePos.y, def.range >= 900 ? 35 : def.range, 0, Math.PI * 2);
    ctx.fillStyle = valid ? 'rgba(255, 255, 255, 0.25)' : 'rgba(232, 65, 24, 0.35)';
    ctx.fill();
    drawTowerModel({ x: mousePos.x, y: mousePos.y, key: selectedTowerType, angle: 0, level: 1, bankBalance: 0, bankCap: 600 });
  }

  if (selectedPlaced) {
    ctx.beginPath();
    ctx.arc(selectedPlaced.x, selectedPlaced.y, selectedPlaced.range >= 900 ? 35 : selectedPlaced.range, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fill();
    ctx.strokeStyle = '#fbc531';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  towers.forEach(t => drawTowerModel(t));

  bloons.forEach(b => {
    const spec = BLOON_TIERS[b.tier];
    ctx.save();
    ctx.translate(b.x, b.y);

    if (spec.boss) {
      ctx.fillStyle = '#2980b9';
      ctx.beginPath();
      ctx.ellipse(0, 0, 32, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ecf0f1';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(-34, -14, 10, 28);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`MOAB (${b.hp})`, 0, 4);
    } else {
      ctx.fillStyle = spec.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, spec.r * 0.85, spec.r, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = spec.lead ? '#2f3640' : 'rgba(0,0,0,0.35)';
      ctx.lineWidth = spec.lead ? 2.5 : 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-3, spec.r);
      ctx.lineTo(3, spec.r);
      ctx.lineTo(0, spec.r + 4);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.ellipse(-spec.r * 0.3, -spec.r * 0.35, 2.5, 4.5, -0.4, 0, Math.PI * 2);
      ctx.fill();

      if (b.slowTimer > 0) {
        ctx.strokeStyle = '#74b9ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(-spec.r, -spec.r, spec.r*2, spec.r*2);
      }
      if (b.glueTimer > 0) {
        ctx.fillStyle = 'rgba(76, 209, 55, 0.65)';
        ctx.beginPath();
        ctx.arc(0, 0, spec.r * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  });

  projectiles.forEach(p => {
    ctx.fillStyle = p.kind === 'laser' ? '#e84118' : p.kind === 'glue' ? '#4cd137' : p.kind === 'homing' ? '#8c7ae6' : '#1e272e';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.kind === 'splash' ? 6 : 4, 0, Math.PI * 2);
    ctx.fill();
  });

  effects.forEach(ef => {
    if (ef.type === 'beam') {
      ctx.strokeStyle = ef.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(ef.x1, ef.y1);
      ctx.lineTo(ef.x2, ef.y2);
      ctx.stroke();
    } else if (ef.type === 'ring' || ef.type === 'boom') {
      ctx.fillStyle = ef.type === 'boom' ? 'rgba(232, 65, 24, 0.35)' : ef.color;
      ctx.beginPath();
      ctx.arc(ef.x, ef.y, ef.r, 0, Math.PI * 2);
      ctx.fill();
    } else if (ef.type === 'text') {
      ctx.fillStyle = ef.color;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ef.text, ef.x, ef.y);
    }
  });

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e84118';
    ctx.font = 'bold 52px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '20px sans-serif';
    ctx.fillText(`You survived ${wave} waves! Click Menu to try again.`, canvas.width / 2, canvas.height / 2 + 30);
  }
}

function loop() {
  for (let i = 0; i < speedMult; i++) update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
